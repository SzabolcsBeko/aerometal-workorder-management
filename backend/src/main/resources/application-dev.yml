spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workorder_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-location: classpath:schema.sql
      data-location: classpath:data.sql


springdoc:
  swagger-ui:
    path: /swagger-ui.html        

server:
  port: 8080
