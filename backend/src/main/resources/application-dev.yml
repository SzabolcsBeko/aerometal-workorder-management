spring:

  datasource:
    url: jdbc:mysql://localhost:3306/workorder_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  sql:
    init:
      mode: never
    
springdoc:
  swagger-ui:
    path: /swagger-ui.html        

server:
  port: 8080
